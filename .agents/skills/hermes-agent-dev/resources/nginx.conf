# ==============================================================================
# File: nginx.conf
# Purpose: Cấu hình Nginx Reverse Proxy chuẩn hóa cho Hermes Web Dashboard.
#          Hỗ trợ giao tiếp WebSocket đầy đủ để tránh hiện tượng treo màn hình tải.
# ==============================================================================

# 1. Chuyển hướng toàn bộ traffic HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name hermes.hikarione.cloud;

    # Đường dẫn xác thực Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cấu hình HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hermes.hikarione.cloud;

    # Đường dẫn trỏ tới chứng chỉ SSL Let's Encrypt trên VPS
    ssl_certificate /etc/letsencrypt/live/hermes.hikarione.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes.hikarione.cloud/privkey.pem;

    # Cấu hình SSL Security nâng cao (khuyên dùng cho doanh nghiệp)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Kích hoạt gzip để tối ưu tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        # Kích hoạt Basic Authentication để bảo vệ Dashboard (Khuyên dùng)
        # auth_basic "Restricted Access";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # Chuyển tiếp tới container Dashboard chạy ở cổng 9119 trên host
        proxy_pass http://127.0.0.1:9119;
        
        # Cấu hình quan trọng giúp hỗ trợ đầy đủ kết nối WebSocket của Dashboard
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Thiết lập các tiêu đề chuyển tiếp thông tin client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình timeout cho kết nối WebSocket lâu dài không bị đứt quãng
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Tắt proxy buffering cho các luồng streaming dữ liệu của Agent
        proxy_buffering off;
    }
}
